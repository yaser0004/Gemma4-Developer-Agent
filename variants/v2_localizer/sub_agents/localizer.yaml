name: localizer
model: gemma-4-31b-it-qat-w4a16-ct
description: >-
  Read-only code investigator. Give it the issue (or a focused question). It explores the
  repository in its own separate context and returns a short report with the exact files,
  line numbers, relevant code, conventions, and tests you need. Its exploration does not
  consume your context, so use it instead of reading many files yourself.
instruction: !include ../prompts/localizer.md
tools:
  - run_command
  - read_file
  - search_similar_code
  - get_code_neighbors
generate_content_config: !include ../configs/sampling.yaml
